[mutmut]
# Sprint U-106 (2026-06-05): Mutation-Testing-Konfiguration fuer 5eyes-Backend.
#
# Setup (opt-in, KEINE neue Dep in requirements.txt):
#   pip install mutmut
#   cd 5eyes-backend
#   mutmut run --paths-to-mutate=services/risk_metrics_kpi.py,services/recommendation_run_cleanup.py
#   mutmut results
#
# Empfohlener Workflow:
#   1. Wert-stark gepruefte Module zuerst (hoechste Coverage + klare Tests)
#   2. mutmut run dauert MINUTEN bis STUNDEN je nach Modul-Groesse
#   3. Surviving Mutanten = Test-Luecke, NICHT zwangslaeufig Bug
#   4. Patch fuer Test-Erweiterung pro Survivor
#
# Skip-Liste: bewusst NICHT mutiert weil
#   - test_*: Test-Code selber
#   - .venv/, __pycache__: dependencies/bytecode
#   - .tmp_pytest/: pytest temp files
#   - models/: SQLAlchemy-Schema (Mutation bricht hauptsaechlich Imports)
#   - main.py: App-Bootstrap (Mutation testet nicht die echte Logik)
paths_to_mutate=services/,routers/
tests_dir=tests/
runner=python -m pytest -x -q
backup=False

# Mutmut-Output landet unter .mutmut-cache/ — vom .gitignore ausgenommen.
cache_only=False
