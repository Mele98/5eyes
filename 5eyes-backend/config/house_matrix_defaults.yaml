# Sprint U-44 (2026-06-04): HouseMatrix-Defaults als YAML
# ─────────────────────────────────────────────────────────
# Single-Source-of-Truth fuer die 6 HouseMatrix-Risikoprofile.
# Berater/Compliance kann diese YAML ohne Code-Aenderung
# anpassen — nach Reload werden die Werte vom portfolio_engine
# konsumiert.
#
# Schema pro Profil (alle Werte in bps, 10000 = 100%):
#   score_from, score_to:        Score-Range (1-10)
#   name:                        Profilname
#   liquidity_min/target/max:    Liquiditaets-Bandbreite
#   bonds_min/target/max:        Anleihen-Bandbreite
#   equities_min/target/max:     Aktien-Bandbreite
#   real_estate_min/target/max:  Immobilien-Bandbreite
#   alternatives_min/target/max: Alternative-Bandbreite
#   max_risky_fraction_bps:      ASIP-Obergrenze risky (U-P23.X)
#   equity_minimum_bps:          Equity-Minimum fuer Profil
#
# WICHTIG:
# Diese YAML wird gegen tests/test_house_matrix_yaml_consistency.py
# verifiziert — alle Werte muessen identisch zu portfolio_engine's
# Hardcoded-Defaults sein. Wenn jemand einen Wert hier aendert ohne
# Spec-Diskussion: Test schlaegt fehl.
#
# Owner-Entscheid 2026-06-14:
# Immobilien duerfen profiluebergreifend bis maximal 20% reichen.
# Die Zielquoten bleiben unveraendert; Risikobudget und alle anderen
# Portfolio-Constraints gelten weiterhin.

profiles:
