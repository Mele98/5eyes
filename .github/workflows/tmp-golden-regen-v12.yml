# TEMPORAER (VARIANT-GOAL-PRESERVATION-GATE-001, Engine v12): erzeugt die
# CH-Golden-Fixtures auf dem Linux-Runner unter OPENBLAS_CORETYPE=Haswell UND
# =Nehalem (Threads = 1) und prueft Byte-Identitaet. Wird im naechsten Commit
# wieder entfernt, sobald das Artefakt abgeholt ist.
name: TEMP golden regen v12

on:
  push:
    branches:
      - fix/variant-goal-preservation-gate-v12

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate (Haswell)
        working-directory: 5eyes-backend
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: "Haswell"
          DB_PATH: /tmp/regen_haswell.db
        run: python _ci_regen_golden.py _ci_regen_output/haswell

      - name: Regenerate (Nehalem)
        working-directory: 5eyes-backend
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: "Nehalem"
          DB_PATH: /tmp/regen_nehalem.db
        run: python _ci_regen_golden.py _ci_regen_output/nehalem

      - name: Compare Haswell vs Nehalem (byte-identisch)
        working-directory: 5eyes-backend
        run: |
          diff -r _ci_regen_output/haswell _ci_regen_output/nehalem && echo "BYTE-IDENTICAL"
          sha256sum _ci_regen_output/*/*.json

      - name: Upload regenerated golden snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-regen-golden-snapshots-v12
          path: 5eyes-backend/_ci_regen_output/
          retention-days: 3
