# TEMPORAER (GOAL-CALENDAR-HORIZON-PARITY-001 + GOAL-REAL-SPENDING-INFLATION-PARITY-001, Engine v17): erzeugt die
# CH-Golden-Fixtures auf dem Linux-Runner unter OPENBLAS_CORETYPE=Haswell UND
# =Nehalem (Threads = 1), prueft Byte-Identitaet und belegt den Fix-Effekt im
# Default-Pfad mit erzwungenem v16-Seed gegen die eingecheckten v16-Fixtures.
# Wird im naechsten Commit wieder entfernt.
name: TEMP golden regen v17

on:
  push:
    branches:
      - audit/goal-calendar-real-v17

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fix-Effekt Default (v17-Code, erzwungener v16-Seed)
        working-directory: 5eyes-backend
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: "Haswell"
          DB_PATH: /tmp/regen_forced_v16.db
          FORCE_ENGINE_VERSION: "saa_resampled_v16"
        run: |
          python _ci_regen_golden.py _ci_regen_output/forced_v16
          diff -r tests/fixtures/golden_ch_recommendations _ci_regen_output/forced_v16 && echo "FIX-EFFECT-DEFAULT-ZERO" || echo "FIX-EFFECT-PRESENT"

      - name: Regenerate (Haswell)
        working-directory: 5eyes-backend
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: "Haswell"
          DB_PATH: /tmp/regen_haswell.db
        run: python _ci_regen_golden.py _ci_regen_output/haswell

      - name: Regenerate (Nehalem)
        working-directory: 5eyes-backend
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: "Nehalem"
          DB_PATH: /tmp/regen_nehalem.db
        run: python _ci_regen_golden.py _ci_regen_output/nehalem

      - name: Compare Haswell vs Nehalem (byte-identisch)
        working-directory: 5eyes-backend
        run: |
          diff -r _ci_regen_output/haswell _ci_regen_output/nehalem && echo "BYTE-IDENTICAL"
          sha256sum _ci_regen_output/*/*.json
          for f in _ci_regen_output/haswell/*.json; do
            n=$(basename "$f")
            if cmp -s "$f" "tests/fixtures/golden_ch_recommendations/$n"; then echo "UNCHANGED $n"; else echo "CHANGED $n"; fi
          done

      - name: Upload regenerated golden snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-regen-golden-snapshots-v17
          path: 5eyes-backend/_ci_regen_output/
          retention-days: 3
