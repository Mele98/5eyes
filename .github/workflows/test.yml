name: Tests

on:
  push:
    branches:
      - develop
      - main
      - 'codex/**'
  pull_request:
    branches:
      - develop
      - main

# Sprint U-53 (2026-06-04): concurrency-group spart Compute bei
# Push-Storm (z.B. Codex' rapid-fire commits). Neue Push auf gleiche
# ref canceled noch laufende Runs.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    # E1 (2026-06-14): Dedizierter, schneller Gate fuer die sicherheitskritischen
    # Tests (harte Mandanten-Trennung, Auth, 2FA, Onboarding). Laeuft VOR der
    # vollen Suite und failt bei der ERSTEN Verletzung (--maxfail=1), damit eine
    # Cross-Tenant-Leak-Regression nicht im 3900-Test-Lauf untergeht.
    # Single Source of Truth: scripts/security_gate.py.
    name: Security Gate (Tenant-Isolation & Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security gate
        run: python scripts/security_gate.py

  engine-line-budget-gate:
    # ENGINE-LINE-BUDGET-RATCHET-001 (Kontrollrunde 2026-09-27): ADR-014
    # (2026-08-03) reduzierte services/portfolio_engine.py von 8'820 auf
    # ~3'671 Zeilen -- ohne Schutzmechanismus wuchs die Datei binnen 7,5
    # Wochen wieder auf 7'215 Zeilen (+95%) an. Eigener, dependency-freier
    # Job (reine Standardbibliothek, kein pip install) faellt in Sekunden,
    # bevor der 90-Minuten-Backend-Lauf ueberhaupt startet.
    # Single Source of Truth: scripts/check_engine_line_budget.py.
    name: Engine Line Budget Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check portfolio_engine.py line budget
        run: python3 scripts/check_engine_line_budget.py

  # ------------------------------------------------------------------------
  # Backend-Suite parallel (F0-3, 2026-10-24). Vorher ein serieller Job
  # `pytest tests/` mit zuletzt ~157 min Wandzeit (Run 40005758865) und
  # 200 min Job-Timeout. Jetzt:
  #   backend-test-plan      volle Collection (Referenzliste aller Node-IDs)
  #   backend-test-shard     8 Matrix-Shards (pytest-split nach .test_durations,
  #                          Algorithmus duration_based_chunks = Dateien bleiben
  #                          zusammenhaengend), je Shard `-n auto --dist loadfile`
  #                          (pytest-xdist; eigene DB je Worker, tests/conftest.py)
  #   backend-test-wallclock Tests mit Marker wallclock_budget seriell, ohne
  #                          parallele Nachbarprozesse (Wandzeit-Schranken)
  #   pytest ("Backend Tests (3.12)")  Aggregat-/Pflicht-Check: alle Teiljobs
  #                          gruen UND scripts/ci_test_shard_gate.py belegt,
  #                          dass jeder gesammelte Test genau einmal selektiert
  #                          und ausgefuehrt wurde (sonst rot).
  # Der Check-Name "Backend Tests (3.12)" bleibt unveraendert (Tooling haengt
  # daran). Historie des seriellen Jobs: git log -- .github/workflows/test.yml.
  #
  # TEST-TEARDOWN-HANG-001: Shard- und Wallclock-Lauf laufen unter
  # scripts/pytest_supervisor.py (externe Prozessgrenze mit getrennten
  # Fristen fuer Collection, Testkoerper, Fixture-Teardown, Session-Ende und
  # Interpreter-Exit; einmaliger Stackdump, kurze Grace-Period, Abbruch des
  # ganzen Prozessbaums inkl. xdist-Worker non-zero, erster Fehlerstatus
  # bleibt erhalten, JSON-Evidence unter ci-out/supervisor/). Strict-Leak-
  # Guard ist in Shard-, Wallclock- und Aggregat-Job aktiv; das Aggregat
  # prueft die Evidence aller 9 Laeufe. Die GitHub-timeout-minutes sind nur
  # noch Notbremse oberhalb der Supervisor-Fristen.
  # ------------------------------------------------------------------------
  backend-test-plan:
    name: Backend Test Plan (collect)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect full suite (reference list)
        working-directory: ares-backend
        run: |
          python -m pytest tests/ --collect-only -q -p no:cacheprovider > ci-collected.txt
          tail -n 3 ci-collected.txt

      - name: Upload reference collection
        uses: actions/upload-artifact@v6
        with:
          name: test-plan
          path: ares-backend/ci-collected.txt
          retention-days: 14

  backend-test-shard:
    name: Backend Test Shard ${{ matrix.group }}/8
    runs-on: ubuntu-latest
    # Erwartung je Shard ~8-16 min (Gesamtlaufzeit / 8 Shards / 4 vCPU; Untergrenze = laengste
    # Einzeldatei, gemessen bis ~14 min unter Last, da --dist loadfile Dateien nicht teilt).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    # OMP/OPENBLAS/MKL_NUM_THREADS=1 (2026-09-09): golden-snapshot-Test
    # bucket5_ausgewogen_default_prefs flakte wiederholt auf CI (396 vs.
    # 397 bps, ULP-Differenz), obwohl die Monte-Carlo-Inputs deterministisch
    # geseedet sind (deterministic_seed()). Ursache: SLSQP's interne BLAS-
    # Linearalgebra summiert unter Multi-Threading nicht garantiert in
    # fixer Reihenfolge, und ephemere Runner haben wechselnde Kernzahlen.
    # Single-Threaded BLAS erzwingt deterministische Summationsreihenfolge.
    # Nur CI-Jobumgebung -- betrifft nie die ausgelieferte Windows-Electron-
    # Desktop-App des echten Kunden.
    #
    # Nachtrag (2026-09-16): derselbe Flake trat trotz Thread-Pinning auf
    # mehreren unabhaengigen PRs erneut auf (immer dieselbe Fixture, immer
    # kleine bps-Differenzen). Ursache Nummer zwei: `numpy.show_config()`
    # zeigt "DYNAMIC_ARCH" fuer die installierte scipy-openblas-Wheel --
    # OpenBLAS waehlt zur Laufzeit einen von mehreren einkompilierten
    # Mikroarchitektur-Kerneln passend zur tatsaechlichen Runner-CPU (z.B.
    # Haswell vs. Skylake vs. Zen). Zwei "ubuntu-latest"-Runs koennen auf
    # unterschiedlicher physischer Hardware landen und deshalb einen
    # anderen Kernel waehlen -- exakt dieselbe Rechnung rundet dann anders,
    # obwohl Threads, Seed und Software-Versionen identisch sind.
    # OPENBLAS_CORETYPE erzwingt IMMER denselben Kernel unabhaengig von der
    # tatsaechlichen Runner-CPU. Haswell (AVX2+FMA3) ist seit ~2013 auf
    # praktisch jeder x86-64-Cloud-CPU vorhanden und damit sicher portabel.
    #
    # F0-3: die Variablen stehen auf Job-Ebene und werden von jedem
    # xdist-Worker-Prozess geerbt (gleiches Pinning pro Worker wie vorher im
    # seriellen Lauf).
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
      FIVEEYES_STRICT_LEAK_GUARD: "1"
      SPLIT_ARGS: >-
        --splits 8 --group ${{ matrix.group }}
        --splitting-algorithm duration_based_chunks
        --durations-path .test_durations
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record shard selection
        working-directory: ares-backend
        run: |
          mkdir -p ci-out/selection ci-out/junit
          python -m pytest tests/ --collect-only -q -p no:cacheprovider $SPLIT_ARGS -m "not wallclock_budget" \
            > ci-out/selection/shard-${{ matrix.group }}.txt
          tail -n 3 ci-out/selection/shard-${{ matrix.group }}.txt

      - name: Run pytest shard (correctness gate, no coverage)
        working-directory: ares-backend
        run: |
          python ../scripts/pytest_supervisor.py run --evidence-dir ci-out/supervisor/shard-${{ matrix.group }} \
            --startup-timeout 600 --test-timeout 900 --teardown-timeout 180 --session-timeout 300 \
            --exit-timeout 90 --grace 15 -- \
            python -m pytest tests/ -n auto --dist loadfile $SPLIT_ARGS -m "not wallclock_budget" \
            --tb=short --maxfail=50 -o junit_family=xunit1 \
            --junit-xml=ci-out/junit/shard-${{ matrix.group }}.xml

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-shard-${{ matrix.group }}
          path: ares-backend/ci-out/
          retention-days: 14
          if-no-files-found: warn

  backend-test-wallclock:
    name: Backend Test Wallclock Budgets (serial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
      FIVEEYES_STRICT_LEAK_GUARD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record selection
        working-directory: ares-backend
        run: |
          mkdir -p ci-out/selection ci-out/junit
          python -m pytest tests/ --collect-only -q -p no:cacheprovider -m wallclock_budget \
            > ci-out/selection/wallclock.txt
          tail -n 3 ci-out/selection/wallclock.txt

      - name: Run wallclock-budget tests serially
        working-directory: ares-backend
        run: |
          python ../scripts/pytest_supervisor.py run --evidence-dir ci-out/supervisor/wallclock \
            --startup-timeout 600 --test-timeout 900 --teardown-timeout 180 --session-timeout 300 \
            --exit-timeout 90 --grace 15 -- \
            python -m pytest tests/ -p no:xdist -m wallclock_budget --tb=short --maxfail=50 \
            -o junit_family=xunit1 --junit-xml=ci-out/junit/wallclock.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-wallclock
          path: ares-backend/ci-out/
          retention-days: 14
          if-no-files-found: warn

  pytest:
    # Aggregat-Job = Pflicht-Check mit dem historischen Namen
    # "Backend Tests (3.12)" (Name + Matrix-Suffix bewusst unveraendert).
    name: Backend Tests
    needs: [backend-test-plan, backend-test-shard, backend-test-wallclock]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIVEEYES_STRICT_LEAK_GUARD: "1"
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - name: All test jobs succeeded
        env:
          PLAN: ${{ needs.backend-test-plan.result }}
          SHARDS: ${{ needs.backend-test-shard.result }}
          WALLCLOCK: ${{ needs.backend-test-wallclock.result }}
        run: |
          echo "plan=$PLAN shards=$SHARDS wallclock=$WALLCLOCK"
          test "$PLAN" = success && test "$SHARDS" = success && test "$WALLCLOCK" = success

      - name: Checkout
        if: always()
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download results
        if: always()
        uses: actions/download-artifact@v6
        with:
          path: ci-artifacts

      - name: Completeness gate (every collected test selected and run exactly once)
        if: always()
        run: |
          mkdir -p ci-gate/selection ci-gate/junit
          cp ci-artifacts/test-shard-*/selection/*.txt ci-artifacts/test-wallclock/selection/*.txt ci-gate/selection/ || true
          cp ci-artifacts/test-shard-*/junit/*.xml ci-artifacts/test-wallclock/junit/*.xml ci-gate/junit/ || true
          python scripts/ci_test_shard_gate.py \
            --collected ci-artifacts/test-plan/ci-collected.txt \
            --selection-dir ci-gate/selection \
            --junit-dir ci-gate/junit \
            --merged-junit-out ci-gate/junit-merged.xml \
            --durations-out ci-gate/test_durations.json \
            --file-summary 15

      - name: Supervisor evidence gate (every run ended in time, green, without leaks)
        if: always()
        run: python scripts/pytest_supervisor.py verify --evidence-root ci-artifacts --expect 9

      - name: Upload merged junit and measured durations
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # test_durations.json -> ares-backend/.test_durations uebernehmen,
          # wenn die Shard-Balance nachlaesst (neue/teure Tests).
          name: test-gate-${{ matrix.python-version }}
          path: ci-gate/
          retention-days: 30
          if-no-files-found: warn

  coverage:
    # CI-COVERAGE-ON-PUSH (2026-10-18): Coverage lief frueher als zweiter,
    # voller Suite-Durchlauf IM PR-Job (continue-on-error, 60 min) und brach
    # bei >8100 Tests jedes Mal am eigenen Timeout ab -- kein Report, aber
    # 60 min Runner-Zeit pro PR. Jetzt eigener, nicht-blockierender Job nur
    # nach Merge (push auf develop/main) mit ausreichend Zeit.
    # F0-3 (2026-10-24): parallel wie das Gate (8 Shards x xdist-Worker,
    # pytest-cov kombiniert die Worker je Shard), danach `coverage combine`
    # ueber alle Shards im Job coverage-combine. Weiterhin nicht blockierend.
    name: Backend Coverage Shard ${{ matrix.group }}/8 (push only, non-blocking)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest shard with coverage
        working-directory: ares-backend
        run: |
          python -m pytest tests/ --tb=short -n auto --dist loadfile \
            --splits 8 --group ${{ matrix.group }} --splitting-algorithm duration_based_chunks \
            --durations-path .test_durations \
            --cov=services --cov=routers --cov=schemas --cov=models --cov-report=

      - name: Rename coverage data
        if: always()
        working-directory: ares-backend
        run: |
          if [ -f .coverage ]; then mv .coverage .coverage.shard-${{ matrix.group }}; fi

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.group }}
          path: ares-backend/.coverage.shard-${{ matrix.group }}
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn

  coverage-combine:
    name: Backend Coverage (push only, non-blocking)
    if: github.event_name == 'push' && always()
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download coverage data
        uses: actions/download-artifact@v6
        with:
          pattern: coverage-data-*
          path: ares-backend/coverage-data
          merge-multiple: true

      - name: Combine and report
        working-directory: ares-backend
        run: |
          ls -la coverage-data
          python -m coverage combine coverage-data
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-3.12
          path: ares-backend/coverage.xml
          retention-days: 14
          if-no-files-found: warn

  postgres-rls:
    name: Postgres RLS Adversarial Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiveeyes_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiveeyes_rls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ares-backend/requirements.txt

      - name: Install dependencies
        working-directory: ares-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Postgres RLS adversarial tests
        working-directory: ares-backend
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fiveeyes_rls
        # RLS-COVERAGE-GUARD-NOT-WIRED-IN-CI-001 (Kontrollrunde 2026-09-27):
        # test_rls_dynamic_table_coverage_guard.py wurde am 2026-08-17 explizit
        # als CI-Guard gebaut ("verhindert, dass eine neue tenant_id-Tabelle
        # unbemerkt ohne RLS-Policy durchrutscht"), lief seither aber in
        # KEINEM CI-Job -- nur lokal, wenn ein Entwickler manuell
        # POSTGRES_TEST_DATABASE_URL setzt. Der selbst dokumentierte Zweck
        # des Guards war damit in der Praxis nie durchgesetzt. Dieselbe
        # Postgres-Instanz/dieselben Rechte wie die beiden bereits laufenden
        # Testdateien (eigene, isolierte Schema pro Testlauf).
        # ALEMBIC-NEVER-EXECUTED-ON-POSTGRES-001 (E2E-Durchlauf 2026-10-12):
        # test_postgres_alembic_views_live.py ist neu. Die Migrationen wurden
        # bis dahin in KEINEM CI-Job gegen echtes Postgres AUSGEFUEHRT --
        # test_postgres_bootstrap_migrations.py faehrt sie gegen SQLite und
        # erzeugt die Postgres-DDL nur offline als Text, und die
        # RLS-Testdateien bauen ihr Schema mit create_all bzw. per Hand. Eine
        # Anweisung, die SQLite akzeptiert und Postgres ablehnt, kam damit
        # durch die gesamte Suite; genau so blieben die drei fehlenden
        # Reporting-Views unbemerkt. Laeuft auf derselben Postgres-Instanz,
        # eigenes Schema pro Lauf.
        run: python -m pytest tests/test_postgres_rls_adversarial.py tests/test_authten07_login_guard_postgres_ddl.py tests/test_rls_dynamic_table_coverage_guard.py tests/test_postgres_alembic_views_live.py tests/test_postgres_rls_global_reference_rows.py tests/test_postgres_wealth_tenant_boundary_live.py -q

  vitest:
    # Sprint U-53 (2026-06-04): Frontend Reporting Sub-App vitest in CI.
    # Pre-U-53 lief vitest nur lokal — Bundle-Size (U-56), Sort-Filter-
    # Logic (U-48/U-49), Keyboard-Shortcuts (U-51) etc. wurden nicht in
    # CI verifiziert.
    name: Frontend Reporting Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ares-desktop/frontend/reporting/package-lock.json

      - name: Install npm dependencies
        working-directory: ares-desktop/frontend/reporting
        run: npm ci

      - name: Build dist (fuer U-56 Bundle-Size-Tests)
        working-directory: ares-desktop/frontend/reporting
        run: npm run build

      - name: Run vitest
        working-directory: ares-desktop/frontend/reporting
        run: npx vitest run

      - name: Upload vitest log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-log
          path: ares-desktop/frontend/reporting/node_modules/.vite/
          retention-days: 7
