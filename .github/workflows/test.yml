name: Tests

on:
  push:
    branches:
      - develop
      - main
      - 'codex/**'
  pull_request:
    branches:
      - develop
      - main

# Sprint U-53 (2026-06-04): concurrency-group spart Compute bei
# Push-Storm (z.B. Codex' rapid-fire commits). Neue Push auf gleiche
# ref canceled noch laufende Runs.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    # E1 (2026-06-14): Dedizierter, schneller Gate fuer die sicherheitskritischen
    # Tests (harte Mandanten-Trennung, Auth, 2FA, Onboarding). Laeuft VOR der
    # vollen Suite und failt bei der ERSTEN Verletzung (--maxfail=1), damit eine
    # Cross-Tenant-Leak-Regression nicht im 3900-Test-Lauf untergeht.
    # Single Source of Truth: scripts/security_gate.py.
    name: Security Gate (Tenant-Isolation & Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security gate
        run: python scripts/security_gate.py

  pytest:
    name: Backend Tests
    runs-on: ubuntu-latest
    # 2026-08-04 (Mega-Audit-Nachlauf, war seit 2026-06-08 stale bei "3400
    # Tests"): Backend-Suite liegt inzwischen bei ueber 5000 Tests. Lokal
    # ~17min, CI-Runner braucht laenger wegen pip-Install. 30min Puffer.
    # 2026-08-18: PR #374 (Stochastic-Optimizer-Produktionsdefault + Audit-
    # Nachlauf) bringt die Suite auf 5991 Tests (+~1000). Lokal (ohne -v/
    # --cov) 5991 Tests zweimal gruen in ~24min. In CI zweimal unabhaengig
    # am Timeout gescheitert -- nicht an einem Testfehler ("operation was
    # canceled", nie ein FAILED): Lauf 1 bei 21%/30min, Lauf 2 bei 39%/60min.
    # Beide Datenpunkte extrapolieren konsistent auf ~150min fuer die volle
    # Suite -- ein strukturelle ~6x-Faktor, kein Zufalls-Ausreisser. Vermutete
    # Ursache: coverage.py's Line-Tracing trifft die Python-seitigen Monte-
    # Carlo-/Optimizer-Schleifen (viele Python-Level-Iterationen um NumPy-
    # Calls) besonders hart; -v addiert Log-Streaming-Overhead obendrauf.
    # Sofort-Fix hier: -v entfernt (kein Funktionsverlust, --tb=short zeigt
    # Fehler weiterhin), Timeout auf Basis der beiden echten Messpunkte
    # grosszuegig auf 120min gesetzt. ECHTER Fix ist noch offen (siehe
    # docs/planning/2026-08-17-consolidated-pr-description.md): entweder
    # pytest-xdist einfuehren (braucht Parallel-Sicherheits-Audit der Suite,
    # nicht blind aktiviert) oder Coverage-Tracking aus dem PR-Gate in einen
    # separaten, nicht-blockierenden Job verschieben.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        working-directory: 5eyes-backend
        run: |
          python -m pytest tests/ --tb=short --maxfail=5 \
            --cov=services --cov=routers --cov=schemas --cov=models \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: 5eyes-backend/coverage.xml
          retention-days: 14

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-log
          path: 5eyes-backend/.pytest_cache/
          retention-days: 7

  postgres-rls:
    name: Postgres RLS Adversarial Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiveeyes_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiveeyes_rls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Postgres RLS adversarial tests
        working-directory: 5eyes-backend
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fiveeyes_rls
        run: python -m pytest tests/test_postgres_rls_adversarial.py -q

  vitest:
    # Sprint U-53 (2026-06-04): Frontend Reporting Sub-App vitest in CI.
    # Pre-U-53 lief vitest nur lokal — Bundle-Size (U-56), Sort-Filter-
    # Logic (U-48/U-49), Keyboard-Shortcuts (U-51) etc. wurden nicht in
    # CI verifiziert.
    name: Frontend Reporting Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 5eyes-electron/frontend/reporting/package-lock.json

      - name: Install npm dependencies
        working-directory: 5eyes-electron/frontend/reporting
        run: npm ci

      - name: Build dist (fuer U-56 Bundle-Size-Tests)
        working-directory: 5eyes-electron/frontend/reporting
        run: npm run build

      - name: Run vitest
        working-directory: 5eyes-electron/frontend/reporting
        run: npx vitest run

      - name: Upload vitest log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-log
          path: 5eyes-electron/frontend/reporting/node_modules/.vite/
          retention-days: 7
