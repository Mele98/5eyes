name: Tests

on:
  push:
    branches:
      - develop
      - main
      - 'codex/**'
  pull_request:
    branches:
      - develop
      - main

# Sprint U-53 (2026-06-04): concurrency-group spart Compute bei
# Push-Storm (z.B. Codex' rapid-fire commits). Neue Push auf gleiche
# ref canceled noch laufende Runs.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    # E1 (2026-06-14): Dedizierter, schneller Gate fuer die sicherheitskritischen
    # Tests (harte Mandanten-Trennung, Auth, 2FA, Onboarding). Laeuft VOR der
    # vollen Suite und failt bei der ERSTEN Verletzung (--maxfail=1), damit eine
    # Cross-Tenant-Leak-Regression nicht im 3900-Test-Lauf untergeht.
    # Single Source of Truth: scripts/security_gate.py.
    name: Security Gate (Tenant-Isolation & Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run security gate
        run: python scripts/security_gate.py

  pytest:
    name: Backend Tests
    runs-on: ubuntu-latest
    # 2026-08-04 (Mega-Audit-Nachlauf, war seit 2026-06-08 stale bei "3400
    # Tests"): Backend-Suite liegt inzwischen bei ueber 5000 Tests. Lokal
    # ~17min, CI-Runner braucht laenger wegen pip-Install. 30min Puffer.
    # 2026-08-18/19: PR #374 (Stochastic-Optimizer-Produktionsdefault +
    # Audit-Nachlauf) bringt die Suite auf 5991 Tests (+~1000). Drei CI-
    # Laeufe unter --cov=services/routers/schemas/models scheiterten
    # (30min@21%, 60min@39%, 120min mit einer 21-minuetigen KOMPLETTEN
    # Stille direkt nach 48% -- "operation was canceled", nie ein FAILED).
    # Verdaechtigt: test_golden_snapshot_ch_regression.py (naechste Datei
    # in der Kollektionsreihenfolge, rechenintensivste Monte-Carlo-Datei
    # der Suite). Lokal (Windows) mit IDENTISCHEN --cov-Flags einzeln
    # gemessen: nur 26s->37s (1.4x), UND die volle Suite lokal mit exakt
    # denselben Flags lief sauber durch genau diese Datei und weit darueber
    # hinaus durch -- kein Haenger reproduzierbar. Schluss: das ist ein
    # Linux/CI-Runner-spezifisches Coverage-Instrumentierungs-Problem
    # (vermutlich coverage.py + sqlite/multiprocessing-Interaktion unter
    # Linux), kein Code-Bug in diesem PR. Fix: Coverage-Tracking aus dem
    # BLOCKIERENDEN Pytest-Lauf entfernt (siehe Schritte unten) -- die
    # Korrektheits-Pruefung (was den PR mergebar macht) laeuft jetzt ohne
    # --cov und faellt damit auf die schnelle, verlaessliche lokale Zeit
    # (~20-25min) zurueck. Coverage laeuft als eigener, NICHT blockierender
    # Schritt danach (continue-on-error) mit eigenem Timeout, damit ein
    # erneuter Coverage-Haenger den PR nicht mehr blockieren kann.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (correctness gate, no coverage)
        working-directory: 5eyes-backend
        run: |
          python -m pytest tests/ --tb=short --maxfail=5

      # Nicht blockierend (continue-on-error) mit eigenem Timeout: Coverage-
      # Instrumentierung ist auf diesem Runner nachweislich (siehe Kommentar
      # oben am Job) fuer einen Teil der Suite unverhaeltnismaessig langsam/
      # haengt -- ein erneutes Auftreten darf den PR-mergebar-Status nicht
      # mehr blockieren. Best-effort: liefert das Coverage-Artefact wenn es
      # rechtzeitig durchlaeuft, sonst wird dieser Schritt einfach als
      # fehlgeschlagen markiert und ignoriert.
      - name: Run pytest with coverage (best-effort, non-blocking)
        if: always()
        working-directory: 5eyes-backend
        continue-on-error: true
        timeout-minutes: 60
        run: |
          python -m pytest tests/ --tb=short \
            --cov=services --cov=routers --cov=schemas --cov=models \
            --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.python-version }}
          path: 5eyes-backend/coverage.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-log
          path: 5eyes-backend/.pytest_cache/
          retention-days: 7

  postgres-rls:
    name: Postgres RLS Adversarial Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiveeyes_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiveeyes_rls"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 5eyes-backend/requirements.txt

      - name: Install dependencies
        working-directory: 5eyes-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Postgres RLS adversarial tests
        working-directory: 5eyes-backend
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fiveeyes_rls
        run: python -m pytest tests/test_postgres_rls_adversarial.py tests/test_authten07_login_guard_postgres_ddl.py -q

  vitest:
    # Sprint U-53 (2026-06-04): Frontend Reporting Sub-App vitest in CI.
    # Pre-U-53 lief vitest nur lokal — Bundle-Size (U-56), Sort-Filter-
    # Logic (U-48/U-49), Keyboard-Shortcuts (U-51) etc. wurden nicht in
    # CI verifiziert.
    name: Frontend Reporting Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 5eyes-electron/frontend/reporting/package-lock.json

      - name: Install npm dependencies
        working-directory: 5eyes-electron/frontend/reporting
        run: npm ci

      - name: Build dist (fuer U-56 Bundle-Size-Tests)
        working-directory: 5eyes-electron/frontend/reporting
        run: npm run build

      - name: Run vitest
        working-directory: 5eyes-electron/frontend/reporting
        run: npx vitest run

      - name: Upload vitest log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-log
          path: 5eyes-electron/frontend/reporting/node_modules/.vite/
          retention-days: 7
