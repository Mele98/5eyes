texts:
  "investment_approach.title": "Investitionsansatz"
  "investment_approach.paragraphs":
  - "Unser Anlageansatz beruht auf dem Prinzip des zielbasierten Investierens. Gemeinsam mit Ihnen wird eine individuelle strategische Asset Allokation (iSAA) festgelegt, die in diesem Dokument unter «Ihre persönliche Anlagestrategie» dokumentiert ist. Referenzwährung ist der Schweizer Franken. Die iSAA wurde unter Berücksichtigung Ihres Risikoprofils, Ihrer finanziellen Situation, Ihrer konkreten Ziele sowie Ihrer Präferenzen optimiert. Ziel ist es, die Wahrscheinlichkeit für die Erreichung Ihrer Lebensziele und den Zielerreichungsgrad bestmöglich auszurichten."
  - "Wir folgen einem klaren Prinzip der Strategietreue. Empirisch ist vielfach belegt, dass die strategische Asset Allokation den weitaus grössten Teil der langfristigen Portfoliorendite und -volatilität erklärt (Brinson, Hood & Beebower, 1986; Ibbotson & Kaplan, 2000), während taktische Markt-Timing-Versuche und häufige Umschichtungen statistisch signifikant zu Underperformance führen (vgl. Dalbar QAIB-Studien; Vanguard «Advisor's Alpha»). Aus diesem Grund verzichten wir bewusst auf taktische Anpassungen, prognoseabhängige Marktwetten und kurzfristige Reaktionen auf Marktbewegungen. Eine diszipliniert beibehaltene Strategie ist nach heutigem Stand der Wissenschaft der entscheidende Hebel für eine erfolgreiche Vermögensentwicklung über lange Zeiträume."
  - "Wir betreiben dementsprechend keine laufende Portfolio-Überwachung mit aktiver Steuerung oder Re-Balancing aus Marktgründen. Die definierte iSAA bleibt grundsätzlich bestehen, solange sich Ihre persönlichen und finanziellen Verhältnisse nicht wesentlich ändern. Eine Neujustierung der Strategie erfolgt ausschliesslich anlässlich der periodischen Aktualisierung der Eignungsprüfung — gemeinsam mit Ihnen — oder wenn Sie uns relevante Veränderungen mitteilen (z.B. Berufswechsel, Pensionierung, Erbschaft, neue Ziele, geänderter Anlagehorizont). Ein eigenmächtiges Eingreifen unseres Hauses in die Allokation findet nicht statt. Allfällige Re-Balancing-Entscheidungen liegen in Ihrer Hand bzw. werden ausdrücklich gemeinsam mit Ihnen beschlossen."
  - "Diese disziplinierte Vorgehensweise ist Ausdruck unserer Überzeugung, dass langfristiger Anlageerfolg weniger durch aktives Reagieren auf den Markt als vielmehr durch eine sorgfältig hergeleitete und konsequent durchgehaltene Strategie entsteht. Eine Garantie für die Zielerreichung kann auch in diesem Rahmen nicht abgegeben werden, da Anlageergebnisse von künftigen Marktentwicklungen abhängen, die ausserhalb unseres Einflussbereichs liegen."
  "investment_universe.title": "Anlageuniversum"
  "investment_universe.intro": "Zur Umsetzung der Anlagestrategie können insbesondere aktiv und passiv verwaltete Anlagefonds, Indexfonds sowie ETFs unterschiedlicher Anlageklassen, die weltweit investieren, eingesetzt werden. In Bezug auf diese Anlagefonds bestehen keine Einschränkungen, beispielsweise hinsichtlich Anlageuniversum, Domizilland, Rechtsform, Währung, Währungsabsicherung, Anlageländer, Ausschüttungspolitik, Anlagetechniken oder Anlagestrategie des Anlagefonds. Es können zudem Anlagefonds eingesetzt werden, die keinen oder mehrere nachhaltige Anlageansätze verfolgen. Folgende Arten von Anlagefonds können insbesondere eingesetzt werden (Aufzählung nicht abschliessend):"
  "investment_universe.bullets":
  - "Geldmarkt-, Obligationen-, Aktien-, Immobilien-, Rohstoff-, Edelmetall-, Commodities- und Mischfonds;"
  - "Dachfonds (Fund of Funds), sofern diese selbst keine Dachfonds-Produkte enthalten. Sie werden in Bezug auf Dachfonds darauf hingewiesen, dass gewisse Kosten doppelt anfallen können – einmal auf Ebene Dachfonds und einmal auf Ebene der Zielfonds;"
  - "Anlagefonds, die in alternative Anlagen (z.B. Hedge Funds, Private Equity, Insurance Linked Securities) investieren, sofern sie zur Verbesserung des Risiko-/Renditeprofils des Gesamtportfolios eingesetzt werden;"
  - "Derivate innerhalb der Anlagefonds (z.B. zur Absicherung von Fremdwährungs- oder Marktrisiken und/oder zu Investitionszwecken)."
  "investment_universe.outro":
  - "Zur Umsetzung der Anlagestrategien können zudem auch strukturierte Produkte (insbesondere, aber nicht ausschliesslich Zertifikate) eingesetzt werden."
  - "Daneben kann ein Teil der Vermögenswerte als Liquidität auf dem Konto gehalten werden."
  - "Die Referenzwährung ist der CHF. Anlagen in anderen Währungen sind zulässig, womit die Vermögenswerte Wechselkursrisiken ausgesetzt sein können."
  "summary.title": "Zusammenfassung"
  "summary.paragraphs":
  - "Dieser Bericht zeigt Ihnen die strategische Asset Allokation, die wir Ihnen empfehlen. Diese Empfehlung basiert auf Ihren Angaben zu Kenntnissen und Erfahrungen, dem Ergebnis Ihrer Eignungsprüfung bzw. dem von Ihnen gewählten Risikoprofil, Ihren Angaben zur Vermögenssituation, Ihrer voraussichtlichen Lebenserwartung, den Zielen, die Sie uns mitgeteilt haben, sowie Ihren Präferenzen."
  - "Sie nehmen zur Kenntnis und erklären sich damit einverstanden, dass eine exakte Umsetzung der Gewichtungen gemäss der empfohlenen strategischen Asset Allokation auf Ebene der Anlageklassen und Sub-Anlageklassen nicht möglich ist. Dies ist insbesondere darauf zurückzuführen, dass bei bestimmten Fonds nur ganze Anteile und keine Fraktionsanteile gezeichnet werden können. Daher stellen die Gewichtungen Richtwerte dar, an die wir uns im Rahmen der Umsetzung und Verwaltung des Portfolios bestmöglich annähern."
  - "In Bezug auf die Sub-Anlageklassen nehmen Sie zur Kenntnis und erklären sich damit einverstanden, dass wir unter Berücksichtigung Ihrer Präferenzen und der Gewichtungen der Anlageklassen im eigenen Ermessen die Gewichtungen der Sub-Anlageklassen anpassen, bestehende Sub-Anlageklassen durch andere ersetzen und auch weitere Sub-Anlageklassen einsetzen können, die nicht in der strategischen Asset Allokation aufgeführt sind."
  "metrics.title": "Erläuterungen zu den Kennzahlen"
  "metrics.definitions":
  - - "Max. Drawdown"
    - "Als maximalen Drawdown bezeichnet man den erwarteten grössten Verlust von einem vorigen Höchststand bis zu einem darauffolgenden Tiefstand. Dieser kann entweder historisch bestimmt werden basierend auf vergangener Performance oder vorausschauend simuliert werden. Bei einer historischen Bestimmung hängt die Kennzahl u.a. von der Länge der verfügbaren historischen Zeitserien ab. Im Fall einer vorausschauenden Simulation hängt die Kennzahl von den erwarteten zukünftigen Eigenschaften der Anlagerenditen ab. Bei den angegebenen Werten handelt es sich um vorausschauende Simulationen."
  - - "Median Rendite CAGR"
    - "Die durchschnittliche jährliche Wachstumsrate (CAGR) im Median-Vermögensszenario ohne Cashflows nach Gebühren. In der Hälfte der Szenarien liegt die CAGR darüber, in der anderen Hälfte darunter."
  - - "Erwartete Rendite"
    - "Die durchschnittliche jährliche Wachstumsrate ohne Cashflows nach Gebühren. Dieser Mittelwert ist ein Mass für die erwartete Rendite. Die tatsächlich realisierte jährliche Wachstumsrate kann in einzelnen Szenarien darüber oder darunter liegen."
  - - "VaR"
    - "Der Value-at-Risk (VaR) ist eine Risikokennzahl, die angibt, welche Rendite über einen gegebenen Anlagehorizont mit einer gegebenen Wahrscheinlichkeit nicht unterschritten wird. Die angegebenen Werte wurden für einen Anlagehorizont von einem Jahr und eine Wahrscheinlichkeit von 99% simuliert."
  - - "Standardabweichung"
    - "Die Standardabweichung ist eine Risikokennzahl, die angibt, wie stark die möglichen jährlichen Renditen um die erwartete Rendite schwanken. Je höher diese Kennzahl, desto stärker schwanken die möglichen Renditen um den erwarteten Wert. Bei normalverteilten Portfoliorenditen liegen die Renditen mit einer Wahrscheinlichkeit von ca. 68% im Bereich von erwarteter Rendite minus einer Standardabweichung bis zur erwarteten Rendite plus einer Standardabweichung."
  - - "Zielerreichung"
    - "Die Zielerreichung misst die Wahrscheinlichkeit und den Zielerreichungsgrad, mit der die angegebenen finanziellen Ziele aus heutiger Perspektive nach unserer Einschätzung erreicht werden können. Falls Ziele nicht vollumfänglich erreicht werden können, berücksichtigt diese Kennzahl ebenfalls, um wieviel das Ziel voraussichtlich verfehlt werden könnte. Die Zielerreichung wird grafisch durch Farbbalken dargestellt — je höher die Wahrscheinlichkeit, desto mehr Balken sind farbig."
  - - "Fehlbetrag ungünstig (P25)"
    - "Der Fehlbetrag misst den Betrag, der als zusätzliches Kapital aus heutiger Perspektive benötigt wird, um das Ziel auch im ungünstigen Szenario zu erreichen. Das ungünstige Szenario entspricht dem 25. Perzentil der simulierten Verläufe (drei Viertel aller Verläufe sind besser)."
  "cover.tagline": "Was auch immer Ihre Ziele sind: wir begleiten Sie Schritt für Schritt zu einem finanziell selbstbestimmten Leben. Individuell, persönlich und mit langjähriger Erfahrung."
