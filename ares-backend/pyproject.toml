# Ares Backend — zentrale Test-Konfiguration.
#
# Vor dieser Datei lebte die Pytest-Konfiguration ausschliesslich im CI-CLI
# (.github/workflows/test.yml). Das hier zentralisiert testpaths, Default-Optionen
# und die Marker-Registry, damit ein lokaler `pytest`-Aufruf dem CI-Lauf entspricht.
#
# Bewusst NICHT gesetzt:
#   - --strict-markers: erst aktivieren, wenn alle Custom-Marker sicher erfasst sind
#     (verhindert, dass ein uebersehener Marker die ganze Suite rot faerbt).
#   - --cov / --cov-fail-under: Coverage bleibt im CI-Kommando. Eine harte Schwelle
#     erst nach Baseline-Messung setzen, sonst bricht der erste Lauf.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -ra"
# Haengt ein einzelner Test laenger als 300 s, dumpt pytest alle Thread-Stacks
# (nicht fatal). Ergaenzt den Exit-Watchdog aus tests/_session_leak_guard.py.
faulthandler_timeout = 300
markers = [
    "network: Test benoetigt echten Netzwerkzugriff (externe Marktdaten-Provider). In Offline-CI via -m 'not network' abwaehlbar.",
    "wallclock_budget: Test prueft eine Wandzeit-Schranke (time.perf_counter). Laeuft in CI seriell in einem eigenen Job ohne parallele Nachbarprozesse, damit CPU-Konkurrenz durch xdist-Worker die Messung nicht verfaelscht.",
]
